<!DOCTYPE html>
<html>
  <head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background: #f8f9fa; font-family: sans-serif; padding: 20px; }
      #log-container { background: #212529; color: #00ff00; height: 400px; overflow-y: scroll; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 14px; }
      #spinner {
        transition: opacity 0.3s ease;
      }
      .d-none {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>Grant Data Processor</h3>
      <button id="btn" class="btn btn-primary" onclick="startProcess()">Process All Reports</button>
      <!-- Add Clear Button -->
      <button class="btn btn-outline-secondary btn-sm" onclick="clearLogs()">Clear Logs</button>
      <hr>
      <div id="log-container">System ready...</div>
    </div>
      <div id="spinner" class="d-none mt-3">
      <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
      </div>
      <span class="ms-2 text-primary">Processing files, please wait...</span>
    </div>


    <script>
      function log(msg) {
        const container = document.getElementById('log-container');
        const div = document.createElement('div');
        const normalizedMsg = msg.toLowerCase();
        
        // Color coding based on log content
        if(msg.includes('SUCCESS')) div.style.color = '#00ff00';
        if(normalizedMsg.includes('error') || normalizedMsg.includes('warning') || normalizedMsg.includes('please upload the correct report')) div.style.color = '#ff4d4d';
        if(msg.includes('DUPLICATE')) div.style.color = '#ffcc00';
        
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
      }
      
      function startProcess() {
        const btn = document.getElementById('btn');
        const spinner = document.getElementById('spinner');

      // UI State: Disable button, show spinner
          btn.disabled = true;
          spinner.classList.remove('d-none'); 
          log("Starting process...");
          
          google.script.run
            .withSuccessHandler(function(logs) {
              // UI State: Hide spinner, enable button
              spinner.classList.add('d-none');
              btn.disabled = false;
              
              logs.forEach(function(msg) {
                log(msg);
              });
              log("--- ALL OPERATIONS COMPLETE ---");
            })
            .withFailureHandler(function(err) {
              spinner.classList.add('d-none');
              btn.disabled = false;
              log("ERROR: " + err);
            })
            .processAllFolders();
      }

      function clearLogs() {
        document.getElementById('log-container').innerHTML = "Logs cleared...";
      }
    </script>
  </body>
</html>
